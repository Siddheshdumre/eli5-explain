<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ELI5.AI · Any topic, explained at your level</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description" content="Ask about any topic and get one real-world analogy at your level (ELI5, Intermediate or Expert), grounded in Wikipedia or live web research, then a quiz to check it stuck." />
  <meta name="author" content="Siddhesh Dumre" />

  <meta property="og:title" content="ELI5.AI · Any topic, explained at your level" />
  <meta property="og:description" content="One real-world analogy at your level, grounded in real sources, then a quiz to check it stuck." />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@siddhesh" />

  <!-- PWA Settings -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090909">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/pwa-192x192.png">

  <!-- Apply the saved/system theme before React loads to avoid a white flash (same "theme" key as next-themes) -->
  <script>
    try {
      var theme = localStorage.getItem("theme");
      if (theme === "dark" || ((!theme || theme === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = "dark";
      }
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
